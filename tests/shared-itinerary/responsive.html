<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Responsive itinerary review</title></head><body style="margin:16px;font:14px system-ui;background:#ddd"><label>Viewport <select id="size"><option value="360">Phone · 360px</option><option value="768">Tablet · 768px</option><option value="1440">Desktop · 1440px</option></select></label> <output id="result"></output><p><iframe title="Shared itinerary" src="/tests/shared-itinerary/layout.html" style="width:360px;height:800px;border:0"></iframe></p><script>
const frame=document.querySelector('iframe');const check=()=>{const doc=frame.contentDocument;document.querySelector('output').textContent=doc.documentElement.scrollWidth>frame.clientWidth?'Horizontal overflow':'No horizontal overflow';};document.querySelector('select').onchange=e=>{frame.style.width=e.target.value+'px';requestAnimationFrame(check);};frame.onload=()=>{new ResizeObserver(check).observe(frame.contentDocument.body);check();};
</script></body></html>
